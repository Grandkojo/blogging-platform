# Database – set in .env or environment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blogging_platform_new?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.servlet.context-path=/api/v1
spring.jpa.open-in-view=false
spring.graphql.graphiql.enabled=true

# JWT – set JWT_SECRET in .env for real use; default below is for local dev only
security.jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me-dev-secret}
security.jwt.ttl=${JWT_TTL:PT1H}
security.jwt.issuer=${JWT_ISSUER:https://blogging-platform}

# Google OAuth2 – set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in .env
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# CORS – optional override via CORS_ALLOWED_ORIGINS; default allows localhost frontends
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
security.cors.allowed-headers=Authorization,Content-Type,Accept
security.cors.max-age=3600