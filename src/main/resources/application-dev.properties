spring.datasource.url=jdbc:mysql://localhost:3306/blogging_platform_new?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=grandkojo
spring.datasource.password=grandsql20
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.servlet.context-path=/api/v1
spring.jpa.open-in-view=false
spring.graphql.graphiql.enabled=true

# JWT (dev only). Override via environment for real deployments.
security.jwt.secret=dev-secret-change-me-dev-secret-change-me-dev-secret
security.jwt.ttl=PT1H
security.jwt.issuer=https://blogging-platform

# CORS: allow localhost origins for React/Vite/JavaFX and same-origin API (e.g. Swagger from same host)
security.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080
security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
security.cors.allowed-headers=Authorization,Content-Type,Accept
security.cors.max-age=3600