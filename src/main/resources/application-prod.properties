# Production – all sensitive values MUST be set via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.error.include-stacktrace=never
server.error.include-message=always

# JWT (prod) – required
security.jwt.secret=${JWT_SECRET}
security.jwt.ttl=${JWT_TTL:PT1H}
security.jwt.issuer=${JWT_ISSUER:https://blogging-platform}

# Google OAuth2 (prod) – required if using Google login
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# CORS (prod) – comma-separated origins; empty = no cross-origin
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
security.cors.max-age=3600