spring.datasource.url=jdbc:mysql://localhost:3306/blogging_platformm
spring.datasource.username=grandkojo
spring.datasource.password=grandsql20
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.error.include-stacktrace=never
server.error.include-message=always

# JWT (prod). Must be provided via environment.
security.jwt.secret=${JWT_SECRET:}
security.jwt.ttl=PT1H
security.jwt.issuer=https://blogging-platform

# CORS (prod). Set allowed origins via security.cors.allowed-origins (comma-separated). If empty, cross-origin browser requests are blocked.
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
security.cors.max-age=3600