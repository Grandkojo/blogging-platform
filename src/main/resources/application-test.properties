# Test database – set in .env or CI environment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/blogging_platform_test?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT (test)
security.jwt.secret=${JWT_SECRET:test-secret-test-secret-test-secret-test-secret}
security.jwt.ttl=PT1H
security.jwt.issuer=https://blogging-platform

# CORS (test)
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080}